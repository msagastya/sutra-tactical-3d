<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>SUTRA & SWORD | Vedic 3D Tactical Arsenal Engine</title>
    <!-- Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP for Smooth Springs & Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Three.js Post-Processing & Unreal Bloom Suite -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030406;
            font-family: 'Rajdhani', sans-serif;
            color: #E6C875;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Ambient Cinematic Glow & Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(3, 4, 6, 0.8) 85%, #000000 100%);
            pointer-events: none;
            z-index: 2;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 215, 0, 0.02), rgba(0, 229, 255, 0.01), rgba(255, 215, 0, 0.02));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 3;
            opacity: 0.7;
        }

        /* High-Authority Tactical HUD Overlay */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: auto;
        }

        .channel-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            border-radius: 20px;
            background: rgba(10, 13, 20, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(12px);
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #F5E296;
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00FF88;
            box-shadow: 0 0 10px #00FF88;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.3); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }

        .hero-title {
            margin-top: 10px;
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #FFFFFF 0%, #F5E296 45%, #C99738 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        .hero-sub {
            font-size: 12px;
            letter-spacing: 3.5px;
            color: rgba(220, 200, 140, 0.7);
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Arsenal Selector Tabs */
        .arsenal-nav {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            background: rgba(8, 10, 15, 0.85);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
        }

        .arsenal-tab {
            background: transparent;
            border: none;
            color: rgba(220, 200, 140, 0.7);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
        }

        .arsenal-tab:hover {
            color: #FFF;
        }

        .arsenal-tab.active {
            background: linear-gradient(135deg, #D4AF37, #99781E);
            color: #030406;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        /* Mid-Screen Tactical Telemetry */
        .telemetry-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 12px;
            letter-spacing: 1.5px;
            pointer-events: none;
        }

        .telemetry-card {
            background: rgba(8, 10, 15, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 8px 14px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .telemetry-label {
            font-size: 9px;
            color: rgba(220, 200, 140, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .telemetry-value {
            font-size: 16px;
            font-weight: 700;
            color: #FFF;
            margin-top: 2px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Material Switcher Pill Dock (Bottom Left) */
        .material-dock {
            position: absolute;
            bottom: 95px;
            left: 20px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }

        .dock-title {
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(212, 175, 55, 0.6);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .material-btn-group {
            display: flex;
            gap: 6px;
            background: rgba(8, 10, 15, 0.85);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            backdrop-filter: blur(10px);
        }

        .mat-btn {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(220, 200, 140, 0.65);
            padding: 6px 10px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .mat-btn.active {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.2);
            color: #FFF;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Bottom Controls Bar */
        .controls-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 10px;
            pointer-events: auto;
            width: calc(100% - 40px);
            max-width: 440px;
        }

        .interactive-btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(25, 22, 15, 0.9), rgba(10, 12, 16, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #F5E296;
            padding: 12px 14px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.15);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .interactive-btn:hover {
            border-color: #F5E296;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .interactive-btn.active {
            background: linear-gradient(135deg, #D4AF37, #99781E);
            color: #000;
            border-color: #FFF;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.7);
        }

        .gyro-btn {
            background: rgba(8, 10, 15, 0.85);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #00E5FF;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .gyro-btn.active {
            background: rgba(0, 229, 255, 0.25);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
        }

        /* Virtual Pointer for 60 FPS Capture */
        #virtual-pointer {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 235, 140, 0.95) 0%, rgba(212, 175, 55, 0.4) 50%, transparent 75%);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 30px #D4AF37, 0 0 60px rgba(212, 175, 55, 0.7);
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            display: none;
            transition: width 0.15s, height 0.15s;
        }

        #virtual-pointer.clicking {
            width: 46px;
            height: 46px;
            background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(212, 175, 55, 0.8) 60%, transparent 85%);
            box-shadow: 0 0 45px #FFF, 0 0 85px #D4AF37;
        }

        /* 3D Dynamic Floating Node Tooltips */
        .floating-label {
            position: absolute;
            background: rgba(8, 10, 15, 0.92);
            border: 1px solid rgba(212, 175, 55, 0.6);
            color: #FFF;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            pointer-events: none;
            z-index: 15;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(212, 175, 55, 0.3);
            white-space: nowrap;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .node-accent {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #D4AF37;
            box-shadow: 0 0 8px #D4AF37;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div id="virtual-pointer"></div>

    <div class="hud-overlay">
        <!-- Header -->
        <div class="header">
            <div class="channel-badge">
                <span class="live-dot"></span>
                <span>SUTRA & SWORD | VEDIC ENGINE 3.0</span>
            </div>
            <h1 class="hero-title" id="artifact-title">SUDARSHANA CHAKRA</h1>
            <p class="hero-sub" id="artifact-sub">KINETIC DISK OF SUPREME DISCRIMINATION</p>

            <!-- Arsenal Selector -->
            <div class="arsenal-nav">
                <button class="arsenal-tab active" onclick="switchArsenal('chakra')">🔱 CHAKRA</button>
                <button class="arsenal-tab" onclick="switchArsenal('trishula')">⚡ TRISHULA</button>
                <button class="arsenal-tab" onclick="switchArsenal('vyuha')">🛡️ CHAKRAVYUHA</button>
            </div>
        </div>

        <!-- Telemetry Row -->
        <div class="telemetry-row">
            <div class="telemetry-card">
                <div class="telemetry-label">SYSTEM STATE</div>
                <div class="telemetry-value" id="state-val">ACTIVE RESTRAINT</div>
            </div>
            <div class="telemetry-card" style="text-align: right;">
                <div class="telemetry-label">CORE ANGULAR FREQ</div>
                <div class="telemetry-value" id="rot-val">120.4 RPM</div>
            </div>
        </div>
    </div>

    <!-- Material Switcher Dock -->
    <div class="material-dock">
        <div class="dock-title">FORGE MATERIAL</div>
        <div class="material-btn-group">
            <button class="mat-btn active" onclick="applyMaterial('gold')">GOLD</button>
            <button class="mat-btn" onclick="applyMaterial('wootz')">WOOTZ</button>
            <button class="mat-btn" onclick="applyMaterial('obsidian')">OBSIDIAN</button>
            <button class="mat-btn" onclick="applyMaterial('plasma')">PLASMA</button>
        </div>
    </div>

    <!-- Bottom Interactive Controls Bar -->
    <div class="controls-bar">
        <button class="interactive-btn" id="btn-explode" onclick="toggleExplodedView()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M3 12h3m12 0h3M12 3v3m0 12v3"/></svg>
            <span id="explode-text">EXPLODE CAD</span>
        </button>
        <button class="interactive-btn" id="btn-overdrive" onclick="toggleOverdrive()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span>KSHATRIYA SURGE</span>
        </button>
        <button class="gyro-btn" id="btn-gyro" onclick="toggleGyro()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <span>GYRO</span>
        </button>
    </div>

    <div id="label-container"></div>

    <script>
        // --- 1. Procedural Web Audio Engine ---
        class TacticalAudioEngine {
            constructor() {
                this.ctx = null;
                this.droneOsc = null;
                this.droneGain = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    // Continuous sub-bass drone
                    this.droneOsc = this.ctx.createOscillator();
                    this.droneGain = this.ctx.createGain();
                    this.droneOsc.type = 'triangle';
                    this.droneOsc.frequency.setValueAtTime(45, this.ctx.currentTime);
                    this.droneGain.gain.setValueAtTime(0.001, this.ctx.currentTime);
                    this.droneOsc.connect(this.droneGain);
                    this.droneGain.connect(this.ctx.destination);
                    this.droneOsc.start();
                }
            }
            updateDrone(rpmNorm) {
                if (!this.ctx || !this.droneGain) return;
                const freq = 40 + rpmNorm * 65;
                const gain = 0.05 + Math.min(rpmNorm * 0.25, 0.2);
                this.droneOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.08);
                this.droneGain.gain.setTargetAtTime(gain, this.ctx.currentTime, 0.08);
            }
            playWhoosh(intensity = 1.0) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(70, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(240 * intensity, this.ctx.currentTime + 0.12);
                osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.35);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(1400 * intensity, this.ctx.currentTime + 0.12);
                filter.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.35);

                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.35 * intensity, this.ctx.currentTime + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.38);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
            playImpact(freq = 55) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq * 2.2, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq, this.ctx.currentTime + 0.07);
                osc.frequency.exponentialRampToValueAtTime(24, this.ctx.currentTime + 0.55);

                gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.65);
            }
            playDamru() {
                if (!this.ctx) return;
                // Dual percussive strike
                [0, 0.1].forEach(delay => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(120, this.ctx.currentTime + delay);
                    osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + delay + 0.08);

                    gain.gain.setValueAtTime(0.5, this.ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + 0.12);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + delay);
                    osc.stop(this.ctx.currentTime + delay + 0.15);
                });
            }
        }
        const audioEngine = new TacticalAudioEngine();

        // Safe Haptic Trigger
        function triggerHaptic(duration = 15) {
            if (navigator.vibrate) {
                try { navigator.vibrate(duration); } catch (e) {}
            }
        }

        // --- 2. Three.js Scene & Camera ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030406, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        // --- 3. Unreal Bloom Post-Processing ---
        const renderPass = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,  // strength
            0.4,  // radius
            0.28  // threshold
        );

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloomPass);

        // --- 4. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xfff0dd, 0.65);
        scene.add(ambientLight);

        const keyGoldLight = new THREE.DirectionalLight(0xFFD700, 3.8);
        keyGoldLight.position.set(5, 8, 7);
        scene.add(keyGoldLight);

        const rimCyanLight = new THREE.PointLight(0x00E5FF, 3.0, 16);
        rimCyanLight.position.set(-6, -4, -3);
        scene.add(rimCyanLight);

        const coreGlowLight = new THREE.PointLight(0xFFAA00, 4.5, 9);
        coreGlowLight.position.set(0, 0, 1);
        scene.add(coreGlowLight);

        // --- 5. Global Dynamic Material Palette ---
        const materials = {
            primary: new THREE.MeshStandardMaterial({
                color: 0xD4AF37,
                metalness: 0.92,
                roughness: 0.18,
                emissive: 0x442D05,
                emissiveIntensity: 0.25
            }),
            secondary: new THREE.MeshStandardMaterial({
                color: 0x1A1F26,
                metalness: 0.85,
                roughness: 0.35,
                emissive: 0x0A0D12,
                emissiveIntensity: 0.1
            }),
            core: new THREE.MeshStandardMaterial({
                color: 0xFFF2A3,
                metalness: 0.2,
                roughness: 0.1,
                emissive: 0xFFAA00,
                emissiveIntensity: 1.6
            }),
            runes: new THREE.MeshBasicMaterial({
                color: 0xFFD700,
                wireframe: true,
                transparent: true,
                opacity: 0.8
            })
        };

        const materialPresets = {
            gold: {
                primary: { color: 0xD4AF37, metalness: 0.92, roughness: 0.18, emissive: 0x442D05, emissiveIntensity: 0.25 },
                secondary: { color: 0x1A1F26, metalness: 0.85, roughness: 0.35, emissive: 0x0A0D12, emissiveIntensity: 0.1 },
                core: { color: 0xFFF2A3, emissive: 0xFFAA00, emissiveIntensity: 1.6 },
                bloom: 1.5,
                rimLight: 0x00E5FF
            },
            wootz: {
                primary: { color: 0x8A929A, metalness: 0.95, roughness: 0.28, emissive: 0x11161A, emissiveIntensity: 0.15 },
                secondary: { color: 0x0E1114, metalness: 0.9, roughness: 0.4, emissive: 0x050709, emissiveIntensity: 0.05 },
                core: { color: 0xE8F4F8, emissive: 0x7097A8, emissiveIntensity: 1.3 },
                bloom: 1.2,
                rimLight: 0xFFFFFF
            },
            obsidian: {
                primary: { color: 0x0D0F12, metalness: 0.98, roughness: 0.12, emissive: 0x00E5FF, emissiveIntensity: 0.35 },
                secondary: { color: 0x050608, metalness: 0.7, roughness: 0.5, emissive: 0x003344, emissiveIntensity: 0.2 },
                core: { color: 0x00E5FF, emissive: 0x00E5FF, emissiveIntensity: 2.2 },
                bloom: 2.0,
                rimLight: 0x00E5FF
            },
            plasma: {
                primary: { color: 0x9D00FF, metalness: 0.8, roughness: 0.2, emissive: 0x7B00FF, emissiveIntensity: 0.7 },
                secondary: { color: 0x120024, metalness: 0.9, roughness: 0.3, emissive: 0x3A0066, emissiveIntensity: 0.4 },
                core: { color: 0x00FFFF, emissive: 0x00FFFF, emissiveIntensity: 2.8 },
                bloom: 2.5,
                rimLight: 0xFF00AA
            }
        };

        window.applyMaterial = function(presetName) {
            audioEngine.init();
            audioEngine.playWhoosh(1.2);
            triggerHaptic(20);

            document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = Array.from(document.querySelectorAll('.mat-btn')).find(b => b.innerText.toLowerCase() === presetName);
            if (activeBtn) activeBtn.classList.add('active');

            const p = materialPresets[presetName];
            gsap.to(materials.primary.color, { r: ((p.primary.color >> 16) & 255) / 255, g: ((p.primary.color >> 8) & 255) / 255, b: (p.primary.color & 255) / 255, duration: 0.5 });
            gsap.to(materials.primary.emissive, { r: ((p.primary.emissive >> 16) & 255) / 255, g: ((p.primary.emissive >> 8) & 255) / 255, b: (p.primary.emissive & 255) / 255, duration: 0.5 });
            materials.primary.emissiveIntensity = p.primary.emissiveIntensity;

            gsap.to(materials.core.emissive, { r: ((p.core.emissive >> 16) & 255) / 255, g: ((p.core.emissive >> 8) & 255) / 255, b: (p.core.emissive & 255) / 255, duration: 0.5 });
            materials.core.emissiveIntensity = p.core.emissiveIntensity;

            gsap.to(bloomPass, { strength: p.bloom, duration: 0.6 });
            gsap.to(rimCyanLight.color, { r: ((p.rimLight >> 16) & 255) / 255, g: ((p.rimLight >> 8) & 255) / 255, b: (p.rimLight & 255) / 255, duration: 0.6 });
        };

        // --- 6. ARSENAL CREATION (Chakra, Trishula, Chakravyuha) ---
        const masterGroup = new THREE.Group();
        scene.add(masterGroup);

        // A. Sudarshana Chakra Group
        const chakraGroup = new THREE.Group();
        masterGroup.add(chakraGroup);

        const layer1_Hub = new THREE.Group();
        const layer2_Blades = new THREE.Group();
        const layer3_Rings = new THREE.Group();
        const layer4_HUD = new THREE.Group();

        chakraGroup.add(layer1_Hub);
        chakraGroup.add(layer2_Blades);
        chakraGroup.add(layer3_Rings);
        chakraGroup.add(layer4_HUD);

        // Hub & Sacred Geometry Core
        const coreGeo = new THREE.OctahedronGeometry(0.85, 2);
        const coreMesh = new THREE.Mesh(coreGeo, materials.core);
        layer1_Hub.add(coreMesh);

        const wireCoreGeo = new THREE.IcosahedronGeometry(1.15, 1);
        const wireCoreMesh = new THREE.Mesh(wireCoreGeo, materials.runes);
        layer1_Hub.add(wireCoreMesh);

        // 32 Precision Serrated Kinetic Blades
        const bladeCount = 32;
        const bladeShape = new THREE.Shape();
        bladeShape.moveTo(0, 0);
        bladeShape.lineTo(0.35, 1.8);
        bladeShape.bezierCurveTo(0.45, 2.3, 0.25, 2.6, 0.05, 2.85);
        bladeShape.lineTo(-0.15, 2.3);
        bladeShape.lineTo(-0.25, 0.5);
        bladeShape.closePath();

        const extrudeSettings = { depth: 0.08, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.04, bevelThickness: 0.04 };
        const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, extrudeSettings);

        for (let i = 0; i < bladeCount; i++) {
            const angle = (i / bladeCount) * Math.PI * 2;
            const bladeMesh = new THREE.Mesh(bladeGeo, materials.primary);
            bladeMesh.position.x = Math.cos(angle) * 1.5;
            bladeMesh.position.y = Math.sin(angle) * 1.5;
            bladeMesh.rotation.z = angle - Math.PI / 2 + 0.25;
            bladeMesh.scale.set(0.9, 0.9, 0.9);
            layer2_Blades.add(bladeMesh);
        }

        // Concentric Tactical Rings
        const innerTorus = new THREE.Mesh(new THREE.TorusGeometry(1.65, 0.07, 16, 64), materials.secondary);
        layer3_Rings.add(innerTorus);

        const outerTorus = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.09, 16, 64), materials.primary);
        layer3_Rings.add(outerTorus);

        // Sacred Hexagram Ring
        for (let r = 0; r < 2; r++) {
            const hex = new THREE.Mesh(new THREE.RingGeometry(1.8, 1.88, 3), materials.runes);
            hex.rotation.z = (r * Math.PI) / 3;
            layer3_Rings.add(hex);
        }

        // B. Trishula Group (Lord Shiva's Cosmic Trident)
        const trishulaGroup = new THREE.Group();
        trishulaGroup.visible = false;
        masterGroup.add(trishulaGroup);

        // Shaft
        const shaftMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 7.5, 20), materials.secondary);
        shaftMesh.position.y = -2.2;
        trishulaGroup.add(shaftMesh);

        // Damru (Hourglass Drum)
        const damruTop = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.45, 16), materials.primary);
        damruTop.position.y = 0.25;
        damruTop.rotation.x = Math.PI;
        const damruBottom = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.45, 16), materials.primary);
        damruBottom.position.y = -0.25;
        const damruCenter = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.05, 8, 24), materials.core);
        trishulaGroup.add(damruTop);
        trishulaGroup.add(damruBottom);
        trishulaGroup.add(damruCenter);

        // Central Trident Spearhead
        const centralProng = new THREE.Mesh(new THREE.ConeGeometry(0.24, 2.6, 4), materials.primary);
        centralProng.position.y = 2.4;
        centralProng.scale.set(1.0, 1.0, 0.35);
        trishulaGroup.add(centralProng);

        // Outer Curved Prongs
        const outerProngCurve = new THREE.TorusGeometry(1.3, 0.09, 16, 32, Math.PI);
        const prongBase = new THREE.Mesh(outerProngCurve, materials.primary);
        prongBase.rotation.z = Math.PI;
        prongBase.position.y = 1.3;
        trishulaGroup.add(prongBase);

        const leftTip = new THREE.Mesh(new THREE.ConeGeometry(0.16, 1.4, 4), materials.primary);
        leftTip.position.set(-1.3, 2.0, 0);
        leftTip.scale.set(1.0, 1.0, 0.4);
        leftTip.rotation.z = -0.15;
        trishulaGroup.add(leftTip);

        const rightTip = new THREE.Mesh(new THREE.ConeGeometry(0.16, 1.4, 4), materials.primary);
        rightTip.position.set(1.3, 2.0, 0);
        rightTip.scale.set(1.0, 1.0, 0.4);
        rightTip.rotation.z = 0.15;
        trishulaGroup.add(rightTip);

        // C. Chakravyuha Group (7-Tier Rotating Labyrinth)
        const vyuhaGroup = new THREE.Group();
        vyuhaGroup.visible = false;
        masterGroup.add(vyuhaGroup);

        const vyuhaRings = [];
        for (let v = 1; v <= 7; v++) {
            const vGroup = new THREE.Group();
            const radius = 0.6 + v * 0.52;
            const segments = 12 + v * 4;
            // Create ring with a tactical breach gate (arc = 1.85 * PI)
            const ringGeo = new THREE.TorusGeometry(radius, 0.05 + (v === 7 ? 0.04 : 0), 12, segments, Math.PI * 1.82);
            const ringMesh = new THREE.Mesh(ringGeo, v % 2 === 0 ? materials.primary : materials.secondary);
            ringMesh.rotation.x = Math.PI / 2.3;
            vGroup.add(ringMesh);

            // Bastion points along the ring
            for (let b = 0; b < v * 2; b++) {
                const bAngle = (b / (v * 2)) * Math.PI * 1.8;
                const bastion = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), materials.core);
                bastion.position.set(Math.cos(bAngle) * radius, Math.sin(bAngle) * radius * 0.38, 0);
                vGroup.add(bastion);
            }

            vyuhaGroup.add(vGroup);
            vyuhaRings.push({ group: vGroup, speed: (v % 2 === 0 ? 1 : -1) * (0.15 + (7 - v) * 0.05) });
        }

        // Center Commander Nucleus
        const guruDronaCore = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45, 1), materials.core);
        vyuhaGroup.add(guruDronaCore);

        // --- 7. Volumetric Ambient Embers & Starfield ---
        const particleCount = 450;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleVel = [];

        for (let i = 0; i < particleCount; i++) {
            particlePos[i * 3] = (Math.random() - 0.5) * 16;
            particlePos[i * 3 + 1] = (Math.random() - 0.5) * 16;
            particlePos[i * 3 + 2] = (Math.random() - 0.5) * 12;
            particleVel.push({
                y: 0.004 + Math.random() * 0.008,
                phase: Math.random() * Math.PI * 2
            });
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xFFD700,
            size: 0.08,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- 8. Interaction & Physics Engine ---
        let currentArsenal = 'chakra';
        let isDragging = false;
        let previousMousePos = { x: 0, y: 0 };
        let targetRotationX = 0;
        let targetRotationY = 0;
        let angularVelocity = 0.035;
        let targetAngularVelocity = 0.035;
        let isExploded = false;
        let isOverdrive = false;
        let gyroActive = false;

        // Interaction Handlers (Touch & Mouse)
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.controls-bar') || e.target.closest('.arsenal-nav') || e.target.closest('.material-dock')) return;
            isDragging = true;
            previousMousePos = { x: e.clientX, y: e.clientY };
            targetAngularVelocity = 0.12;
            audioEngine.init();
            audioEngine.playWhoosh(1.4);
            triggerHaptic(15);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePos.x;
            const deltaY = e.clientY - previousMousePos.y;

            targetRotationY += deltaX * 0.008;
            targetRotationX += deltaY * 0.008;
            previousMousePos = { x: e.clientX, y: e.clientY };

            if (Math.abs(deltaX) > 15) triggerHaptic(8);
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            targetAngularVelocity = isOverdrive ? 0.09 : 0.035;
        });

        // Switch Arsenal Tab
        window.switchArsenal = function(type) {
            audioEngine.init();
            triggerHaptic(25);
            currentArsenal = type;

            document.querySelectorAll('.arsenal-tab').forEach(t => t.classList.remove('active'));
            const tabIdx = type === 'chakra' ? 0 : type === 'trishula' ? 1 : 2;
            document.querySelectorAll('.arsenal-tab')[tabIdx].classList.add('active');

            const titleEl = document.getElementById('artifact-title');
            const subEl = document.getElementById('artifact-sub');

            // Reset exploded view if active
            if (isExploded) toggleExplodedView();

            if (type === 'chakra') {
                audioEngine.playWhoosh(1.6);
                titleEl.innerText = "SUDARSHANA CHAKRA";
                subEl.innerText = "KINETIC DISK OF SUPREME DISCRIMINATION";
                gsap.to(chakraGroup.scale, { x: 1, y: 1, z: 1, duration: 0.6, ease: "power2.out" });
                chakraGroup.visible = true;
                trishulaGroup.visible = false;
                vyuhaGroup.visible = false;
                document.getElementById('btn-explode').style.display = 'flex';
            } else if (type === 'trishula') {
                audioEngine.playDamru();
                titleEl.innerText = "MAHASHIVA TRISHULA";
                subEl.innerText = "TRI-MODAL SOVEREIGNTY OVER PAST, PRESENT & FUTURE";
                chakraGroup.visible = false;
                trishulaGroup.visible = true;
                vyuhaGroup.visible = false;
                gsap.fromTo(trishulaGroup.scale, { x: 0.2, y: 0.2, z: 0.2 }, { x: 1, y: 1, z: 1, duration: 0.7, ease: "back.out(1.5)" });
                document.getElementById('btn-explode').style.display = 'none';
            } else if (type === 'vyuha') {
                audioEngine.playImpact(42);
                titleEl.innerText = "CHAKRAVYUHA BATTLE GRID";
                subEl.innerText = "7-TIER IMPENETRABLE LABYRINTH FORMATION";
                chakraGroup.visible = false;
                trishulaGroup.visible = false;
                vyuhaGroup.visible = true;
                gsap.fromTo(vyuhaGroup.scale, { x: 0.3, y: 0.3, z: 0.3 }, { x: 1, y: 1, z: 1, duration: 0.8, ease: "power2.out" });
                document.getElementById('btn-explode').style.display = 'none';
            }
        };

        // Exploded CAD View
        window.toggleExplodedView = function() {
            if (currentArsenal !== 'chakra') return;
            audioEngine.init();
            audioEngine.playWhoosh(1.5);
            audioEngine.playImpact(50);
            triggerHaptic(30);

            isExploded = !isExploded;
            const btn = document.getElementById('btn-explode');
            const stateEl = document.getElementById('state-val');

            if (isExploded) {
                btn.classList.add('active');
                stateEl.innerText = "EXPLODED CAD VIEW";
                gsap.to(layer1_Hub.position, { z: 2.8, duration: 1.0, ease: "elastic.out(1, 0.75)" });
                gsap.to(layer2_Blades.position, { z: 1.0, duration: 1.0, ease: "elastic.out(1, 0.75)" });
                gsap.to(layer3_Rings.position, { z: -1.2, duration: 1.0, ease: "elastic.out(1, 0.75)" });
                gsap.to(chakraGroup.rotation, { x: 0.65, y: -0.4, duration: 1.2, ease: "power2.out" });
                gsap.to(camera.position, { z: 13.5, duration: 1.0 });
            } else {
                btn.classList.remove('active');
                stateEl.innerText = "ACTIVE RESTRAINT";
                gsap.to(layer1_Hub.position, { z: 0, duration: 0.8, ease: "power3.inOut" });
                gsap.to(layer2_Blades.position, { z: 0, duration: 0.8, ease: "power3.inOut" });
                gsap.to(layer3_Rings.position, { z: 0, duration: 0.8, ease: "power3.inOut" });
                gsap.to(chakraGroup.rotation, { x: 0, y: 0, duration: 0.8, ease: "power2.out" });
                gsap.to(camera.position, { z: 11, duration: 0.8 });
            }
        };

        // Kshatriya Surge Overdrive
        window.toggleOverdrive = function() {
            audioEngine.init();
            audioEngine.playImpact(38);
            triggerHaptic(50);

            isOverdrive = !isOverdrive;
            const btn = document.getElementById('btn-overdrive');
            const stateEl = document.getElementById('state-val');

            if (isOverdrive) {
                btn.classList.add('active');
                stateEl.innerText = "KSHATRIYA SURGE";
                targetAngularVelocity = 0.16;
                gsap.to(bloomPass, { strength: 3.2, radius: 0.85, duration: 0.4 });
                gsap.to(coreGlowLight, { intensity: 9.0, distance: 15, duration: 0.3 });
                gsap.to(keyGoldLight, { intensity: 6.0, duration: 0.3 });
                gsap.to(camera.position, { z: 9.8, duration: 0.5, ease: "back.out(2)" });
            } else {
                btn.classList.remove('active');
                stateEl.innerText = isExploded ? "EXPLODED CAD VIEW" : "ACTIVE RESTRAINT";
                targetAngularVelocity = 0.035;
                gsap.to(bloomPass, { strength: 1.5, radius: 0.4, duration: 0.6 });
                gsap.to(coreGlowLight, { intensity: 4.5, distance: 9, duration: 0.5 });
                gsap.to(keyGoldLight, { intensity: 3.8, duration: 0.5 });
                gsap.to(camera.position, { z: isExploded ? 13.5 : 11, duration: 0.6 });
            }
        };

        // Gyroscope Control
        window.toggleGyro = function() {
            audioEngine.init();
            triggerHaptic(20);
            const btn = document.getElementById('btn-gyro');

            if (!gyroActive) {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            gyroActive = true;
                            btn.classList.add('active');
                        }
                    }).catch(console.error);
                } else if ('ondeviceorientation' in window) {
                    window.addEventListener('deviceorientation', handleOrientation);
                    gyroActive = true;
                    btn.classList.add('active');
                }
            } else {
                window.removeEventListener('deviceorientation', handleOrientation);
                gyroActive = false;
                btn.classList.remove('active');
            }
        };

        function handleOrientation(event) {
            if (!gyroActive) return;
            const gamma = event.gamma || 0; // Left-Right [-90, 90]
            const beta = event.beta || 0;   // Front-Back [-180, 180]
            targetRotationY = (gamma / 45) * 0.6;
            targetRotationX = ((beta - 45) / 45) * 0.6;
        }

        // --- 9. Render Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // Angular Velocity Interpolation
            angularVelocity += (targetAngularVelocity - angularVelocity) * 0.05;

            // Audio Drone Update
            audioEngine.updateDrone(angularVelocity / 0.16);

            // Rotate Chakra Layers
            if (chakraGroup.visible) {
                layer1_Hub.rotation.z += angularVelocity * 1.5;
                layer2_Blades.rotation.z -= angularVelocity * 1.0;
                layer3_Rings.rotation.z += angularVelocity * 0.4;
            }

            // Rotate Trishula Prongs & Resonant Sway
            if (trishulaGroup.visible) {
                trishulaGroup.rotation.z = Math.sin(elapsedTime * 2.0) * 0.08;
                trishulaGroup.rotation.y += angularVelocity * 0.6;
            }

            // Rotate Chakravyuha Concentric Tiers
            if (vyuhaGroup.visible) {
                vyuhaRings.forEach(vr => {
                    vr.group.rotation.z += vr.speed * angularVelocity * 1.5;
                });
                guruDronaCore.rotation.y += angularVelocity * 1.2;
                guruDronaCore.rotation.x += angularVelocity * 0.8;
            }

            // Smooth Drag Inertia
            masterGroup.rotation.x += (targetRotationX - masterGroup.rotation.x) * 0.08;
            masterGroup.rotation.y += (targetRotationY - masterGroup.rotation.y) * 0.08;

            // Core Breathing Pulse
            const corePulse = 1.0 + Math.sin(elapsedTime * 4.0) * 0.04;
            coreMesh.scale.set(corePulse, corePulse, corePulse);

            // Update Particle Field
            const positions = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                positions[idx + 1] += particleVel[i].y;
                positions[idx] += Math.sin(elapsedTime + particleVel[i].phase) * 0.003;
                if (positions[idx + 1] > 8) {
                    positions[idx + 1] = -8;
                    positions[idx] = (Math.random() - 0.5) * 16;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            // Update Telemetry Display
            const rpm = Math.abs(angularVelocity * 180 / Math.PI * 18).toFixed(1);
            document.getElementById('rot-val').innerText = `${rpm} RPM`;

            // Post-Processing Composer Render
            composer.render();
        }
        animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 10. Automated Capture Sequence for 60 FPS Viral Recording ---
        window.runAutomatedDemo = function() {
            const pointer = document.getElementById('virtual-pointer');
            pointer.style.display = 'block';

            const tl = gsap.timeline();

            // 0s - 2s: Enter and drag Chakra with optical bloom
            tl.set(pointer, { left: "80%", top: "60%", opacity: 0 })
              .to(pointer, { opacity: 1, duration: 0.4 })
              .to(pointer, { left: "50%", top: "45%", duration: 0.6, ease: "power2.out" })
              .call(() => {
                  pointer.classList.add('clicking');
                  audioEngine.init();
                  audioEngine.playWhoosh(1.4);
              })
              .to(pointer, {
                  left: "25%",
                  top: "35%",
                  duration: 1.0,
                  ease: "power1.inOut",
                  onUpdate: function() {
                      targetRotationY += 0.08;
                      targetRotationX += 0.04;
                  }
              })
              .call(() => { pointer.classList.remove('clicking'); })

              // 2.2s: Tap "EXPLODE CAD" button
              .to(pointer, { left: "28%", top: "95%", duration: 0.8, ease: "power2.inOut" })
              .call(() => {
                  pointer.classList.add('clicking');
                  window.toggleExplodedView();
              })
              .to({}, { duration: 0.2 })
              .call(() => { pointer.classList.remove('clicking'); })

              // 4.0s: Orbit around exploded CAD layers
              .to(pointer, { left: "70%", top: "45%", duration: 0.8, ease: "power2.out" })
              .call(() => {
                  pointer.classList.add('clicking');
                  audioEngine.playWhoosh(1.6);
              })
              .to(pointer, {
                  left: "30%",
                  top: "55%",
                  duration: 1.2,
                  onUpdate: function() {
                      targetRotationY += 0.12;
                      targetRotationX -= 0.05;
                  }
              })
              .call(() => { pointer.classList.remove('clicking'); })

              // 6.2s: Tap "PLASMA" Material Button
              .to(pointer, { left: "220px", top: "86%", duration: 0.7, ease: "power2.inOut" })
              .call(() => {
                  pointer.classList.add('clicking');
                  window.applyMaterial('plasma');
              })
              .to({}, { duration: 0.2 })
              .call(() => { pointer.classList.remove('clicking'); })

              // 7.4s: Tap "KSHATRIYA SURGE"
              .to(pointer, { left: "55%", top: "95%", duration: 0.7, ease: "power2.inOut" })
              .call(() => {
                  pointer.classList.add('clicking');
                  window.toggleOverdrive();
              })
              .to({}, { duration: 0.2 })
              .call(() => { pointer.classList.remove('clicking'); })

              // 8.8s: Switch to TRISHULA tab
              .to(pointer, { left: "50%", top: "14%", duration: 0.8, ease: "power2.inOut" })
              .call(() => {
                  pointer.classList.add('clicking');
                  window.switchArsenal('trishula');
              })
              .to({}, { duration: 0.2 })
              .call(() => { pointer.classList.remove('clicking'); })

              // 10.2s: Spin Trishula in 3D
              .to(pointer, { left: "75%", top: "50%", duration: 0.8, ease: "power2.out" })
              .call(() => { pointer.classList.add('clicking'); })
              .to(pointer, {
                  left: "25%",
                  top: "50%",
                  duration: 1.2,
                  onUpdate: function() { targetRotationY += 0.14; }
              })
              .call(() => { pointer.classList.remove('clicking'); })

              // 12.0s: Switch to CHAKRAVYUHA tab
              .to(pointer, { left: "62%", top: "14%", duration: 0.7, ease: "power2.inOut" })
              .call(() => {
                  pointer.classList.add('clicking');
                  window.switchArsenal('vyuha');
              })
              .to({}, { duration: 0.2 })
              .call(() => { pointer.classList.remove('clicking'); })

              // 13.5s - 15.5s: Majestic final orbit
              .to(pointer, { left: "50%", top: "50%", opacity: 0, duration: 0.8 })
              .to({}, {
                  duration: 2.0,
                  onUpdate: function() { targetRotationY += 0.03; }
              });

            return tl;
        };
    </script>
</body>
</html>
